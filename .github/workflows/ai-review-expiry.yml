name: AI Review Expiry
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Optional canonical PR number; otherwise all open PRs up to20
        type: string
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r reviewer/requirements.txt
      - id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_review_expiry.py select
  expire:
    needs: select
    if: needs.select.result == 'success' && needs.select.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    uses: ./.github/workflows/ai-review-expire-pr.yml
    with:
      pr: ${{ matrix.pr }}
