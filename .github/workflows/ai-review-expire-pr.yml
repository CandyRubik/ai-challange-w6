name: AI Review Expire PR
on:
  workflow_call:
    inputs:
      pr:
        type: number
        required: true
concurrency:
  group: ai-review-${{ github.repository }}-pr-${{ inputs.pr }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  expire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r reviewer/requirements.txt
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: python scripts/github_review_expiry.py expire --pr "$PR_NUMBER"
