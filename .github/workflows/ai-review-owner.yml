name: AI Review Owner
run-name: 'Review decision PR #${{ inputs.pr }}'

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Canonical PR number
        type: string
        required: true
      action:
        description: Explicit decision
        type: choice
        options: [dismiss, waive_rule, waive_debt, resolve_debt, revoke]
        required: true
      targets:
        description: JSON list of finding hashes, rule/debt IDs or decision IDs to revoke
        type: string
        required: true
      scope:
        description: JSON list of repository path patterns (required for rule waiver)
        type: string
        default: '[]'
      reason:
        description: Owner reason
        type: string
        required: true
      expires_at:
        description: UTC timestamp, default24h/max7d; omit for revoke
        type: string
      review_run:
        description: Complete AI run on the same snapshot, from last7days; omit for revoke
        type: string
      review_attempt:
        description: Source attempt1–20
        type: string
        default: '1'

concurrency:
  group: ai-review-${{ github.repository }}-pr-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize owner decision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    outputs:
      pr: ${{ steps.authorize.outputs.pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r reviewer/requirements.txt
      - id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_review_owner.py authorize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review/decision.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_review_owner.py finalize
  apply:
    name: Apply owner decision
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r reviewer/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_review_owner.py apply
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: result-${{ needs.authorize.outputs.pr }}-${{ github.run_attempt }}
          path: .review/result.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_review_owner.py finalize
